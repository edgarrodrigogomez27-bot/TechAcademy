<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/miEstilo.css">
    <title>Inscripción - TechAcademy</title>
</head>
<body>

    <!-- Hecho con IA porque no sabia como hacerlo-->
    <header>
        <div class="logo">
            <h1>TechAcademy</h1>
        </div>

        <nav class="menu">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="mentoria.html">Mentoria</a></li>
                <li><a href="inscribirse.html" class="btn_destacado">Inscribirse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="seccion_formulario">
            <div class="tarjeta_formulario">
                <h2>Formulario de Inscripción</h2>
                <p class="subtitulo">Completa tus datos para iniciar tu aprendizaje</p>

                <form action="cursos.html" method="GET" class="formulario_inscripcion">
                    
                    <div class="grupo_campo">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" name="nombre_estudiante" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <div class="grupo_campo">
                        <label for="correo">Correo Electrónico:</label>
                        <input type="email" id="correo" name="correo_estudiante" placeholder="ejemplo@correo.com" required>
                    </div>

                    <div class="grupo_campo">
                        <label for="telefono">Teléfono de Contacto:</label>
                        <input type="tel" id="telefono" name="telefono_estudiante" placeholder="Ej. 1234567890" required>
                    </div>

                    <div class="grupo_campo">
                        <label for="curso">Selecciona tu Curso:</label>
                        <select id="curso" name="curso_seleccionado" required>
                            <option value="" disabled selected>-- Selecciona una opción --</option>
                            <option value="frontend">Desarrollo Web FrontEnd</option>
                            <option value="python">Python para Ciencia de Datos</option>
                            <option value="base_datos">Bases de Datos Robustas</option>
                            <option value="backend">Programación Backend con APIs</option>
                        </select>
                    </div>

                    <button type="submit" class="btn_enviar">Confirmar Inscripción</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
